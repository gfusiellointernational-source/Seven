<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>7 - Fanta RPG</title>
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="apple-touch-icon" href="https://i.imgur.com/uxAwB0s.png">
  <link rel="icon" type="image/png" href="https://i.imgur.com/uxAwB0s.png">
  <link rel="manifest" href="manifest.json">
  <style>
    body, html { 
      margin: 0; padding: 0; 
      width: 100vw; height: 100vh; 
      overflow: hidden; 
      background-color: #ffffff; 
    }
    #wrapper-iframe-contenedor {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    iframe { 
      border: none; display: block; 
      position: absolute;
      top: 0; left: 0;
      transform-origin: 0 0;
    }
  </style>
</head>
<body>
  <div id="wrapper-iframe-contenedor">
    <!-- ⚠️ SUSTITUYE ESTO POR EL LINK LARGO DE TU APPS SCRIPT -->
    <iframe id="app-iframe" src="https://script.google.com/macros/s/AKfycbwe7ErJmyncGoblPn9Xk46MIF9FfudJRsRcC2VFYMcug2AYqvdbudKL8XXQF-M85rkg/exec"></iframe>
  </div>

  <script>
    const ANCHO_VIRTUAL = 1024; // 👈 mismo valor que usamos en el viewport de Index.html

    function ajustarEscalaIframe() {
      const iframe = document.getElementById('app-iframe');
      const anchoReal = window.innerWidth;
      const altoReal = window.innerHeight;
      const escala = anchoReal / ANCHO_VIRTUAL;

      iframe.style.width = ANCHO_VIRTUAL + 'px';
      iframe.style.height = (altoReal / escala) + 'px';
      iframe.style.transform = 'scale(' + escala + ')';
    }

    window.addEventListener('load', ajustarEscalaIframe);
    window.addEventListener('resize', ajustarEscalaIframe);
    window.addEventListener('orientationchange', ajustarEscalaIframe);
  </script>
</body>
</html>
